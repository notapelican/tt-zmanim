name: Release plugin

# Cut a plugin release by pushing a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# This builds a plugin-only zip (just wp-plugin/ttcc-zmanim/, with the vendored
# update checker) and attaches it to the GitHub release for that tag. The plugin
# on the site then offers a one-click update (see includes/class-ttcc-updater.php).
# Bump the Version header + TTCC_ZMANIM_VERSION in ttcc-zmanim.php to match the
# tag before tagging, so the update actually registers as newer.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          cd wp-plugin
          zip -r ../ttcc-zmanim.zip ttcc-zmanim \
            -x '*/.git*' '*/.DS_Store' '*/node_modules/*'

      # Created as a DRAFT with the zip attached, then published. Creating the
      # release and uploading the asset are two API calls ~15s apart, and a site
      # whose update check lands in between sees a release with no assets: the
      # update checker then falls back to the repo's source zipball and installs
      # the whole monorepo over the plugin directory (see
      # includes/class-ttcc-updater.php). The checker always skips drafts, so
      # this way it never sees the release until the zip is on it.
      - name: Draft the release with the plugin asset
        uses: softprops/action-gh-release@v2
        with:
          files: ttcc-zmanim.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true

      - name: Publish it, now that the asset is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
